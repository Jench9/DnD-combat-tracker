# docker-compose.dev.yml — bind-mounts the project and restarts on changes.
#   docker compose -f docker-compose.dev.yml up --build
services:
  combat-tracker:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules   # keeps the container's installed packages from being hidden by your folder
    command: node --watch server.js
